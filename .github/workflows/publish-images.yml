name: Publish Docker Images

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/sidmazak

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            context: .
            file: ./Dockerfile
            image: worker-test-nextjs-web
          - name: worker
            context: ./worker
            file: ./worker/Dockerfile
            image: worker-test-nextjs-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Trigger Coolify web deploy
        if: matrix.name == 'web'
        env:
          COOLIFY_WEB_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEB_DEPLOY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "${COOLIFY_WEB_DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "COOLIFY_WEB_DEPLOY_WEBHOOK_URL not set; skipping Coolify web trigger."
            exit 0
          fi
          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "COOLIFY_API_TOKEN not set; cannot call auth-required deploy webhook."
            exit 1
          fi
          curl -fsSL -X POST "$COOLIFY_WEB_DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json"

      - name: Trigger Coolify worker deploy
        if: matrix.name == 'worker'
        env:
          COOLIFY_WORKER_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_WORKER_DEPLOY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "${COOLIFY_WORKER_DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "COOLIFY_WORKER_DEPLOY_WEBHOOK_URL not set; skipping Coolify worker trigger."
            exit 0
          fi
          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "COOLIFY_API_TOKEN not set; cannot call auth-required deploy webhook."
            exit 1
          fi
          curl -fsSL -X POST "$COOLIFY_WORKER_DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json"
